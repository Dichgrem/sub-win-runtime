name: build-offline-installer

on:
  workflow_dispatch:
    inputs:
      include_directx:
        description: 'Include legacy DirectX (June 2010, +96 MB)'
        type: boolean
        default: false
      include_dotnet:
        description: 'Include .NET 6/8/10 runtimes'
        type: boolean
        default: false
      publish_release:
        description: 'Attach the built installer to a GitHub Release (uses the run number as tag)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check winget availability
        shell: pwsh
        run: |
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'winget is not available on this runner' }

      - name: Build payload from official Microsoft CDN
        shell: pwsh
        run: |
          $extra = @{}
          if ('${{ inputs.include_directx }}' -eq 'true') { $extra['IncludeDirectX'] = $true }
          if ('${{ inputs.include_dotnet }}'  -eq 'true') { $extra['IncludeDotNet']  = $true }
          ./build-bundle.ps1 @extra
          ./build-installer.ps1 @extra

      - name: Verify installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw 'installer not produced' }
          "Built: $($exe.Name) ({0:N1} MB)" -f ($exe.Length / 1MB)

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-runtimes-offline-setup
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0   # payload is already compressed

      - name: Attach to release (manual, opt-in)
        if: startsWith(github.ref, 'refs/tags/') || inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.exe
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          generate_release_notes: true
