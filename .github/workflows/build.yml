name: build-and-release

on:
  workflow_dispatch:
    inputs:
      include_directx:
        description: "Include legacy DirectX (June 2010, +96 MB payload)"
        type: boolean
        default: false
      include_dotnet:
        description: "Include .NET 6/8/10 runtimes (+232 MB payload)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check winget availability
        shell: pwsh
        run: |
          winget --version
          if ($LASTEXITCODE -ne 0) { throw 'winget is not available on this runner' }

      - name: Build payload and installer
        shell: pwsh
        run: |
          $extra = @{}
          if ('${{ inputs.include_directx }}' -eq 'true') { $extra['IncludeDirectX'] = $true }
          if ('${{ inputs.include_dotnet }}'  -eq 'true') { $extra['IncludeDotNet']  = $true }
          ./build-bundle.ps1 @extra
          ./build-installer.ps1 @extra

      - name: Locate installer
        id: pkg
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter 'windows-runtimes-????-??-??.exe' | Select-Object -First 1
          if (-not $exe) { throw 'installer not produced' }
          $date = $exe.BaseName -replace '^windows-runtimes-', ''
          $sha  = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$sha  $($exe.Name)" | Set-Content "$($exe.FullName).sha256" -Encoding ASCII
          "asset=$($exe.Name)" >> $env:GITHUB_OUTPUT
          "date=$date"          >> $env:GITHUB_OUTPUT
          "sha=$sha"            >> $env:GITHUB_OUTPUT
          "{0}  {1:N1} MB  sha256 {2}" -f $exe.Name, ($exe.Length / 1MB), $sha.Substring(0, 16)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.pkg.outputs.asset }}
          path: |
            dist/windows-runtimes-????-??-??.exe
            dist/windows-runtimes-????-??-??.exe.sha256
          if-no-files-found: error
          compression-level: 0

      # Convention: tag == title (CalVer, immutable), body generated by GitHub
      # ("What's Changed" + "Full Changelog"), checksum shipped as an extra asset.
      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.pkg.outputs.date }}
          name: v${{ steps.pkg.outputs.date }}
          files: |
            dist/windows-runtimes-????-??-??.exe
            dist/windows-runtimes-????-??-??.exe.sha256
          generate_release_notes: true
          overwrite_files: true
